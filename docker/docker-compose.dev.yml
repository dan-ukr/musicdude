services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "15432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ../db/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  ml:
    build:
      context: ../apps/ml-service
    ports:
      - "8000:8000"

volumes:
  db_data:
