# Render Blueprint — create everything from this file:
#   Render dashboard → New → Blueprint → pick the musicdude repo.
#
# Root Directory stays EMPTY for the Node services (they are npm workspaces and
# need the repo root). The root `build` script compiles packages/shared FIRST —
# `npm run build --workspaces` would run api before shared and fail with
# "Cannot find module '@musicdude/shared'".
#
# The repo is PUBLIC: no secret is ever committed here. Every `sync: false` var
# is entered in the Render dashboard and stored only there.
#
# Values you are prompted for at blueprint creation:
#   DATABASE_URL  Supabase SESSION POOLER URI (host aws-0-<region>.pooler.supabase.com,
#                 user postgres.<project-ref>, port 5432). NOT db.<ref>.supabase.co —
#                 that host publishes no A record, so Render cannot reach it.
#   REDIS_URL     Redis Cloud free tier (redis://default:<password>@<host>:<port>).
#                 One instance serves both local dev and Render.
#   ML_BASE_URL   https://musicdude-ml.onrender.com
#
# Initialize the schema once from your machine (same pooler URI in a local .env):
#   npm run init-db

services:
  - type: web
    name: musicdude-api
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: cd apps/api && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ML_BASE_URL
        sync: false

  # Background workers have no free plan — this is the one unavoidable cost.
  - type: worker
    name: musicdude-worker
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ML_BASE_URL
        sync: false

  - type: web
    name: musicdude-ml
    runtime: docker
    plan: free
    region: frankfurt
    dockerContext: ./apps/ml-service
    dockerfilePath: ./apps/ml-service/Dockerfile
    healthCheckPath: /health

# No `databases:` block and no Key Value service: Postgres lives on Supabase
# (free, pgvector preinstalled, no 30-day expiry) and Redis on Redis Cloud's free
# tier — both reachable from a laptop as well as from Render, so local dev and
# production share one set of backing services.
#
# If you ever move Redis onto Render (free Key Value, 25MB), note its default
# ipAllowList is internal-only and BullMQ needs maxmemoryPolicy: noeviction —
# with eviction enabled, queued jobs disappear silently.
